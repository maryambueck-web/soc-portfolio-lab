name: Synthetic SOC checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline detection tests and synthetic report
        run: python3 pipeline.py
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit dependencies against vulnerability service
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/python -m pip install -r requirements-audit.txt
          .audit-venv/bin/python -m pip_audit -r requirements.txt
